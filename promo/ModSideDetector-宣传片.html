    *{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* 设计令牌取自文档站 docs/assets/site.css，与站点同一套设计语言 */
    --bg:#0b0f12;--bg-2:#11181d;
    --panel:#0f161b;--panel-2:#131c22;
    --line:rgba(125,180,165,.16);--line-accent:rgba(61,220,151,.35);
    --txt:#dbe6e3;--dim:#97aca8;--mute:#6d827e;
    --accent:#3ddc97;--accent2:#38bdf8;
    --warn:#f0b26b;--danger:#ff7a7a;
    --radius:14px;--radius-sm:9px;
    --sans:"HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"JetBrains Mono","Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  }
  html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font-family:var(--sans)}
  .h1,.h2,.h3,.lead,.big-num,.chips,.step,.card,.blab,.mono-s{font-family:var(--sans)}
  .term,.code,.mono-s,.chip{font-family:var(--mono)}
  /* 所有动画均由 JS 时间轴驱动（逐帧录制可复现），全文件无 @keyframes */

  /* ================= 背景三层 ================= */
  #bg{position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(620px 340px at 12% -4%,rgba(61,220,151,.13),transparent 68%),
      radial-gradient(560px 320px at 92% 104%,rgba(56,189,248,.11),transparent 70%),
      var(--bg)}
  #grid{position:fixed;inset:-60%;z-index:1;
    background-image:
      linear-gradient(rgba(61,220,151,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(61,220,151,.055) 1px,transparent 1px);
    background-size:48px 48px;
    transform:perspective(680px) rotateX(60deg);
    mask-image:radial-gradient(ellipse 68% 68% at 50% 50%,#000 18%,transparent 74%);
    -webkit-mask-image:radial-gradient(ellipse 68% 68% at 50% 50%,#000 18%,transparent 74%)}
  #dots{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  #dots i{position:absolute;bottom:-20px;border-radius:50%;background:rgba(61,220,151,.55);
    box-shadow:0 0 6px rgba(61,220,151,.35)}
  #stars{position:fixed;inset:0;z-index:1;pointer-events:none}
  #stars i{position:absolute;border-radius:50%;background:#cfe8ff;opacity:0;
    box-shadow:0 0 5px rgba(207,232,255,.6)}

  /* ================= 舞台 / 镜头 ================= */
  #stage{position:fixed;inset:0;z-index:2}
  .shot{position:absolute;inset:0;opacity:0}
  .shot .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:5vh 5vw 20vh;opacity:0}
  /* 入场：纯 opacity 淡入，不做 scale（1px 边框缩放下亚像素渲染会抖） */
  .an,.an2,.an3{opacity:0;will-change:opacity,transform}

  /* ================= 文字 ================= */
  .h1{font-size:clamp(46px,8.4vw,122px);font-weight:800;letter-spacing:.03em;
    background-image:

/* ================= 播放引擎（JS 时间轴驱动 / 可 seek） ================= */

const gridEl = document.getElementById('grid');
const dotsEl = document.getElementById('dots');
const hudEl  = document.getElementById('hud');
const hudInfo= document.getElementById('hudInfo');

const DISSOLVE  = 400;   // 交叉溶解：旧镜头淡出与新镜头淡入重叠约 0.4s
const SHOT_FADE = 520;   // 元素原地淡入时长

const VH        = window.innerHeight;

const clamp01   = x => x < 0 ? 0 : x > 1 ? 1 : x;
const easeOut   = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function shotStart(i){ let a = 0; for (let k = 0; k < i; k++) a += SCRIPT[k].d; return a; }
function indexAt(ms){ let acc = 0; for (let i = 0; i < SCRIPT.length; i++){ acc += SCRIPT[i].d; if (ms < acc) return i; } return SCRIPT.length - 1; }

/* ---------- 背景浮点 / 星点（全部时间轴驱动，确定性） ---------- */
const dots = [];
(function initDots(){

const stars = [];

/* ---------- 数字滚动 ---------- */
function countItem(n, delay, dur){
  const raw = n.textContent;
  const m = /^\s*(\d+(?:\.\d+)?)\s*([\s\S]*)$/.exec(raw);
  if (!m) return { n, kind: 'fade', delay, dur: 400, scale: false };
  return { n, kind: 'count', delay, dur, num: parseFloat(m[1]),
           suf: raw.slice(raw.indexOf(m[1]) + m[1].length), raw,
           dec: (m[1].split('.')[1] || '').length };
}
/* ---------- 打字机：把整行拆成逐字符 span，预量每个字符的位置 ---------- */
/* 关键：字符 span 用 position:relative（不参与布局），光标是绝对定位元素，
   因此「逐字符出现」不会造成任何重排 —— 已打出的文字原地不动。            */
function makeTyping(n){
  const wrap = document.createElement('span');
  wrap.className = 'tw';
  while (n.firstChild) wrap.appendChild(n.firstChild);

  let text = '';
  const chars = [];
  /* 按【文档顺序】递归拆分所有文本节点：空格与着色 span（PS&gt; / python…）里的字
     也逐个拆开，这样 chars 的顺序 === 可见字符顺序，光标才能准确落在行末。
     span 本身保留，只在其内部插入 .ch，因此着色与换行都不变。 */
  const splitAll = node => {
    const kids = Array.prototype.slice.call(node.childNodes);
    for (const ch of kids){
      if (ch.nodeType === 3){
        const frag = document.createDocumentFragment();
        for (const c of ch.data){
          if (c === '\n' || c === '\r' || c === '\t') continue;
          const sp = document.createElement('span');
          sp.className = 'ch'; sp.textContent = c;
          frag.appendChild(sp); chars.push(sp); text += c;
        }
        if (frag.childNodes.length) node.replaceChild(frag, ch);
        else node.removeChild(ch);
      } else if (ch.nodeType === 1){
        splitAll(ch);
      }
    }
  };
  splitAll(wrap);
  n.appendChild(wrap);

  const caret = document.createElement('i');
  caret.className = 'caret';
  n.appendChild(caret);      // 初始挂在行元素上；打字时移进 .tw 的内联流

  return { wrap, chars, caret, text };
}

/* ---------- SVG 构件 ---------- */
const SVGNS = 'http://www.w3.org/2000/svg';
function makeRing(size, stroke, color, dash){
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'ring');
  svg.setAttribute('width', size); svg.setAttribute('height', size);
  svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
  const r = (size - stroke) / 2, c = size / 2, C = 2 * Math.PI * r;
  const mk = (col, extra) => {
    const el = document.createElementNS(SVGNS, 'circle');
    el.setAttribute('cx', c); el.setAttribute('cy', c); el.setAttribute('r', r);
    el.setAttribute('stroke', col); el.setAttribute('stroke-width', stroke);
    if (extra) el.setAttribute('stroke-dasharray', extra);
    svg.appendChild(el); return el;
  };
  if (dash) mk('rgba(61,220,151,.30)', (C / 14).toFixed(2) + ' ' + (C / 24).toFixed(2));
  else mk('rgba(61,220,151,.16)', null);
  const fg = mk(color, C.toFixed(2));
  fg.setAttribute('stroke-dashoffset', C.toFixed(2));
  fg.setAttribute('transform', 'rotate(-90 ' + c + ' ' + c + ')');
  return { svg, fg, C };
}
function makeChart(barsEl){
  const w = barsEl.clientWidth || 1200, h = barsEl.clientHeight || 320;
  const svg = document.createElementNS(SVGNS, 'svg');

  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  const mk = (pts, col) => {
    const pl = document.createElementNS(SVGNS, 'polyline');
    pl.setAttribute('points', pts); pl.setAttribute('fill', 'none');
    pl.setAttribute('stroke', col); pl.setAttribute('stroke-width', '1.5');
    svg.appendChild(pl); return pl;
  };
  const a = mk([[0,h*.88],[w*.18,h*.72],[w*.36,h*.78],[w*.54,h*.54],[w*.72,h*.46],[w*.88,h*.28],[w,h*.14]]
              .map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '), 'rgba(61,220,151,.42)');
  const b = mk([[0,h*.97],[w*.22,h*.92],[w*.44,h*.95],[w*.66,h*.87],[w*.84,h*.81],[w,h*.75]]
              .map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '), 'rgba(255,122,122,.34)');
  barsEl.insertBefore(svg, barsEl.firstChild);

}
const rgbOf = n => n.classList.contains('c-green') ? '61,220,151'

/* ---------- 为一个镜头收集所有动画（全部原地：无 translate 入场） ---------- */
function prepare(el){

  el.querySelectorAll('.rv').forEach(n => fade(n, parseInt(n.dataset.at || '0', 10), SHOT_FADE));

  el.querySelectorAll('.h1').forEach(n => {

      r.style.width = r.style.height = (520 + k * 240) + 'px';

      items.push({ n: r, kind: 'ripple', delay: 300, period: 3400, phase: k * 1200, amp: .45 - k * .12 });
    }
  });

  el.querySelectorAll('.h2').forEach((n, k) => { items.push({ n, kind: 'draw', delay: 220 + k * 80, dur: 620 }); glow(n, 300); });
  el.querySelectorAll('.h3').forEach((n, k) => { items.push({ n, kind: 'draw', delay: 180 + k * 80, dur: 600 }); glow(n, 700); });
  el.querySelectorAll('.chip').forEach((n, k) => { fade(n, 220 + k * 120, 420, false); glow(n, k * 320); });

  el.querySelectorAll('.credit').forEach(n => { fade(n, 520, 620, false); items.push({ n, kind: 'sweep', delay: 800, dur: 1700 }); });
  el.querySelectorAll('.docsite').forEach(n => fade(n, 420, 560, false));
  el.querySelectorAll('.docsite b').forEach(n => items.push({ n, kind: 'sweep', delay: 680, dur: 1500 }));

  if (stepsEl){
    const kids = Array.prototype.slice.call(stepsEl.querySelectorAll('.step'));
    const tops = kids.map(s => s.offsetTop);
    const hs   = kids.map(s => s.offsetHeight);

  el.querySelectorAll('.duo .card').forEach((n, k) =>
    items.push({ n, kind: 'card', delay: 120 + k * 260, dur: 480, good: n.classList.contains('good') }));
  // 判定四态行：逐行点亮（纯 opacity + 边框发光，无位移无缩放）
  el.querySelectorAll('.side-row').forEach((n, k) =>
    items.push({ n, kind: 'card', delay: 140 + k * 170, dur: 460, good: !n.classList.contains('unk') }));
  el.querySelectorAll('.card.bad').forEach(n =>
    items.push({ n, kind: 'shake', delay: 620, dur: 760, amp: .010, freq: 7 }));
  el.querySelectorAll('.code.bad').forEach(n =>
    items.push({ n, kind: 'shake', delay: 700, dur: 900, amp: .012, freq: 8 }));

  // 数据条：行淡入 + 条生长 + 右侧数字同步滚动
  el.querySelectorAll('.brow').forEach((n, k) => {
    fade(n, 100 + k * 260, 460);
    const bar = n.querySelector('.track > i');
    const lab = n.querySelector('.blab span:last-child');
    const delay = 220 + k * 260, dur = 1150;
    if (bar){ const to = parseFloat(n.dataset.w) || 0; items.push({ n: bar, kind: 'bar', delay, dur, to }); }
    if (lab) items.push(countItem(lab, delay, dur));
    items.push({ n, kind: 'pulse', delay: 0, period: 2600, phase: k * 700, amp: .06 });
  });
  const barsEl = el.querySelector('.bars');
  if (barsEl){
    const polys = makeChart(barsEl);
    polys.forEach((pl, k) => items.push({ n: pl, kind: 'poly', delay: 500 + k * 260, dur: 1400, len: pl.getTotalLength() }));
    if (el.querySelector('.track.c')){
      const wrap = document.createElement('div');
      wrap.className = 'corner';
      const R = makeRing(168, 9, 'var(--accent)', true);
      wrap.appendChild(R.svg);
      inner.appendChild(wrap);
      fade(wrap, 700, 600, false);
      items.push({ n: R.fg, kind: 'ring', delay: 900, dur: 1600, C: R.C });
      items.push({ n: R.svg, kind: 'spin', delay: 900, period: 5200 });
    }
  }

  // 终端：命令行逐字符打字机 + 其余行逐行淡入（后面行会随打字进度依次出现）
  const hasCmd = !!el.querySelector('.tl .p');
  const base = hasCmd ? 760 : 180;
  const tls = Array.prototype.slice.call(el.querySelectorAll('.tl'));
  let cmdDone = 0;
  tls.forEach((n, k) => {
    if (n.querySelector('.p')){
      const t = makeTyping(n);
      const CH = 42;                                   // 每字符 42ms，速度均匀
      const PUNCT = /[，。、：；！？,.!?:;]/;          // 标点处略停
      const stops = [];
      let acc = 0;
      for (let q = 0; q < t.chars.length; q++){
        acc += CH + (PUNCT.test(t.chars[q].textContent) ? 90 : 0);
        stops.push(acc);
      }
      const dur = Math.max(600, acc);
      cmdDone = dur;
      items.push({ n, kind: 'typech', delay: 180, dur, stops, mode: 'cmd', t });
    } else {
      fade(n, base + k * 150, 300, false);
    }
  });
  el.querySelectorAll('.term').forEach((n, k) => {
    items.push({ n, kind: 'scan', delay: 120, period: 2600, phase: k * 600 });
    const tt = n.querySelector('.tt');
    if (tt && tt.textContent.indexOf('✔') < 0 && tt.textContent.indexOf('151 个模组') < 0){
      const R = makeRing(18, 2.5, 'var(--accent)', false);
      n.querySelector('.tbar').appendChild(R.svg);
      items.push({ n: R.fg, kind: 'ring', delay: 200, dur: 4200, C: R.C });
      items.push({ n: R.svg, kind: 'spin', delay: 0, period: 1100 });
    }
  });
  el.querySelectorAll('.code').forEach((n, k) => {
    items.push({ n, kind: 'scan', delay: 300, period: 3200, phase: k * 800 });
  });

  el._items = items;
  return el;
}

function applyItems(el, tl){
  const items = el._items;
  if (!items) return;
  for (let k = 0; k < items.length; k++){
    const it = items[k];
    const p = clamp01((tl - it.delay) / it.dur);
    const e = easeOut(p);
    switch (it.kind){
      case 'fade':
        /* 纯 opacity：不用 scale（1px 边框在缩放下是亚像素渲染，必抖） */
        it.n.style.opacity = e.toFixed(4);
        break;
      case 'bar': {
        const n = it.n;
        if (n.dataset.to === undefined) n.dataset.to = it.to;
        n.style.width = (parseFloat(n.dataset.to) * e).toFixed(3) + '%';
        break;
      }
      case 'count': {
        if (p >= 1){ if (it.n.textContent !== it.raw) it.n.textContent = it.raw; break; }
        const v = Math.max(0, it.num * easeOutBack(p));
        it.n.textContent = v.toFixed(it.dec) + it.suf;
        break;
      }
      /* 逐字符打字机：均匀推进 + 标点停顿 + 行内光标 + 刚打出的字符短暂高亮
         光标位置完全交给浏览器排版：把 <i.caret> 插到「最后一个已输出字符」之后，
         它就在同一行内流里 —— 天然紧跟、不漂移，换行时自动跟到新行开头。 */
      case 'typech': {
        const t = it.t;
        it.n.style.opacity = '1';
        const el2 = Math.max(0, tl - it.delay);
        let cnt = 0;
        while (cnt < it.stops.length && el2 >= it.stops[cnt]) cnt++;
        const done = cnt >= t.chars.length;
        for (let q = 0; q < t.chars.length; q++){
          const on = q < cnt;
          if (t.chars[q]._on !== on){
            t.chars[q]._on = on;
            t.chars[q].classList.toggle('on', on);          // display:none → inline
            t.chars[q].classList.toggle('hit', on && !done && (cnt - 1 - q) < 3);
          }
        }
        /* 光标紧跟最后一个已输出字符：插到它的父节点里（字符可能在被着色的
           行内 span 内），因此用它的 parentNode 做 insertBefore —— 仍然在同一行内流。 */
        if (t._cnt !== cnt){
          t._cnt = cnt;
          let placed = false;
          for (let q = t.chars.length - 1; q >= 0; q--){
            if (q < cnt && t.chars[q].classList.contains('on')){
              const par = t.chars[q].parentNode;
              par.insertBefore(t.caret, t.chars[q].nextSibling);
              placed = true; break;
            }
          }
          if (!placed) t.wrap.insertBefore(t.caret, t.wrap.firstChild);
        }
        t.caret.style.opacity = done ? (Math.floor(tl / 500) % 2 === 0 ? '1' : '0') : '1';
        break;
      }
      case 'sweep':
        it.n.style.backgroundPosition = (130 - 190 * easeInOut(p)).toFixed(2) + '% 0, 0 0';
        break;
      case 'pulse': {
        const s = Math.sin(((tl + it.phase) % it.period) / it.period * Math.PI * 2);
        it.n.style.filter = 'brightness(' + (1 + it.amp * s).toFixed(4) + ')';
        break;
      }
      case 'card':
        it.n.style.opacity = e.toFixed(4);
        it.n.style.boxShadow = it.good
          ? '0 0 ' + (46 * e).toFixed(1) + 'px rgba(61,220,151,' + (.10 * e).toFixed(3) + ')'
          : '0 0 ' + (24 * e).toFixed(1) + 'px rgba(255,122,122,' + (.12 * e).toFixed(3) + ')';
        break;
      case 'scan': {
        const q = Math.max(0, tl - it.delay) + it.phase;
        it.n.style.setProperty('--scan', ((q % it.period) / it.period * 100).toFixed(2) + '%');
        break;
      }
      case 'spin':
        it.n.style.transform = 'rotate(' + (Math.max(0, tl - it.delay) / it.period * 360 % 360).toFixed(1) + 'deg)';
        break;
      case 'draw':
        it.n.style.setProperty('--draw', easeInOut(p).toFixed(4));
        break;
      case 'glow': {
        const s = (Math.sin(((tl + it.phase) % it.period) / it.period * Math.PI * 2) + 1) / 2;
        it.n.style.textShadow = '0 0 ' + (6 + 16 * s).toFixed(1) + 'px rgba(' + it.rgb + ',' + (0.10 + 0.22 * s).toFixed(3) + ')';
        break;
      }
      /* 波纹：位置固定（translate 仅用于居中，不算入场位移），只做 scale + opacity */
      case 'ripple': {
        const q = ((Math.max(0, tl - it.delay) + it.phase) % it.period) / it.period;
        it.n.style.transform = 'translate(-50%,-50%) scale(' + (0.35 + 1.35 * q).toFixed(4) + ')';
        it.n.style.opacity = (Math.sin(Math.PI * q) * it.amp).toFixed(4);
        break;
      }
      /* 高亮色块在列表项之间移动（色块动，文字不动）—— 规范唯一允许的位移之一 */
      case 'hl': {
        const t = Math.max(0, tl - it.delay);
        const seg = it.dwell + it.move;
        const i = Math.min(it.tops.length - 1, Math.floor(t / seg));
        const local = t - i * seg;
        const pi = Math.max(0, i - 1);
        const m = i === 0 ? 1 : easeInOut(clamp01(local / it.move));
        it.n.style.transform = 'translateY(' + (it.tops[pi] + (it.tops[i] - it.tops[pi]) * m).toFixed(2) + 'px)';
        it.n.style.height = (it.hs[pi] + (it.hs[i] - it.hs[pi]) * m).toFixed(2) + 'px';
        it.n.style.opacity = (tl < it.delay ? 0 : clamp01(t / 240)).toFixed(4);
        break;
      }
      /* 步骤序号：用描边色与外发光表示「当前」，不用 scale */
      case 'dot': {
        const t = Math.max(0, tl - it.base);
        const idx = Math.min(it.tops.length - 1, Math.floor(t / (it.dwell + it.move)));
        const on = tl >= it.base && idx === it.k;
        const w = on ? (0.5 + 0.5 * Math.sin(t / 130)) : 0;
        it.n.style.borderColor = on ? 'rgba(255,255,255,' + (0.45 + 0.5 * w).toFixed(3) + ')' : '';
        it.n.style.boxShadow = on ? '0 0 ' + (16 * w).toFixed(1) + 'px rgba(255,255,255,.45)' : '';
        break;
      }
      /* 报错提示：不再 scale 抖动（会抖边框），改成描边色 + 外发光脉冲 */
      case 'shake': {
        let v = 0;
        if (tl >= it.delay && p < 1) v = Math.abs(Math.sin(p * Math.PI * it.freq)) * (1 - p);
        it.n.style.boxShadow = '0 0 ' + (30 * v).toFixed(1) + 'px rgba(255,122,122,' + (.35 * v).toFixed(3) + ')';
        it.n.style.borderColor = v > .35 ? 'var(--danger)' : '';
        break;
      }
      case 'poly':
        it.n.style.strokeDasharray = it.len.toFixed(2);
        it.n.style.strokeDashoffset = (it.len * (1 - e)).toFixed(2);
        break;
      case 'ring':
        it.n.style.strokeDashoffset = (it.C * (1 - easeInOut(p))).toFixed(2);
        break;
    }
  }
}

/* ---------- 配音：edge-tts 预生成 mp3，全部预加载 ----------
   要点（上一版重叠的根因就是没做到这几条）：
     · 页面加载即建立全部 <audio> 并 preload="auto"，不留懒加载延迟；
     · 进入某镜头时先 stopVoice()，保证任意时刻最多一段在响；
     · 不做任何变速（已删除 playbackRate 与「贴合」）；
     · 单实例 + 先 pause 再改 currentTime 再 play()，避免竞态；
     · 文件缺失 → 静默降级（onerror 吞掉，画面继续）。                      */
let VOICE_DIR = 'male';          // 'male' | 'female'
let voiceOn   = false;
const voicePool = {};            // 镜头号 -> HTMLAudioElement（兜底路径 / 元信息）
const voiceBuf  = {};            // 镜头号 -> AudioBuffer（WebAudio 主路径）
const voiceFail = {};            // 镜头号 -> 失败原因
const audioMeta = {};            // 镜头号 -> 时长(秒)
let AC = null;                   // AudioContext（首次播放时创建）
let curSrc = null;               // 当前 BufferSource（最多 1 个）
let curAudio = null;             // 当前 HTMLAudioElement（兜底路径）
let curAudioMode = '';           // 'webaudio' | 'element' | ''
let curAudioIdx = -1;
let curStartWall = 0;            // WebAudio：该段开始的 performance.now()
let audioGen = 0;                // 播放代次，用于丢弃过期重试
let audioAnchorTs = null;        // 该段「开始播放」时对应的时间轴毫秒

function voiceSrc(i){
  if (!SCRIPT[i].sub) return null;
  return 'audio/' + VOICE_DIR + '/' + String(i + 1).padStart(2, '0') + '.mp3';
}
function ensureAC(){
  if (!AC){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx){ try { AC = new Ctx(); } catch (e) { AC = null; } }
  }
  if (AC && AC.state === 'suspended'){ try { AC.resume(); } catch (e) {} }
  return AC;
}
/* 把 mp3 解码成 AudioBuffer：play() 之前就已就绪，出声时刻完全可控。
   注意：Chrome 禁止 file:// 下的 XHR（CORS），所以**只有在 http(s) 下才尝试解码**；
   直接双击打开（file://）时自动走 <audio> 兜底，音质与语速完全一致（同样 1.0x）。 */
function decodeVoice(i, src){
  if (location.protocol === 'file:' && !window.__SYNC_TRY_FILE_DECODE) return;
  const ctx = ensureAC();
  if (!ctx || voiceBuf[i] || voiceFail[i]) return;
  const xhr = new XMLHttpRequest();
  xhr.open('GET', src, true);
  xhr.responseType = 'arraybuffer';
  xhr.onerror = () => { voiceFail[i] = 'xhr';
    console.warn('[ModSideDetector] 配音加载失败（静默降级）：' + src); };
  xhr.onload = () => {
    if (!xhr.response || xhr.status > 399){ voiceFail[i] = 'http'; return; }
    const pr = ctx.decodeAudioData(xhr.response,
      buf => { voiceBuf[i] = buf; audioMeta[i] = buf.duration; },
      () => { voiceFail[i] = 'decode';
              console.warn('[ModSideDetector] 配音解码失败（走 <audio> 兜底）：' + src); });
    if (pr && pr.catch) pr.catch(() => {});
  };
  xhr.send();
}
function preloadVoice(){
  for (let i = 0; i < SCRIPT.length; i++){
    const src = voiceSrc(i);
    if (!src) continue;
    try {
      let a = voicePool[i + 1];
      if (!a){
        a = new Audio();
        a.preload = 'auto';
        a.onerror = () => {                          // 缺失/损坏 → 静默降级 + 控制台留痕
          voiceFail[i + 1] = 'error';
          console.warn('[ModSideDetector] 配音文件不可用（已静默降级）：' + src);
        };
        a.onloadedmetadata = () => { audioMeta[i + 1] = a.duration || 0; };
        a.load();
        voicePool[i + 1] = a;
      }
      if (a.getAttribute('src') !== src){
        try { a.pause(); } catch (e) {}
        a.setAttribute('src', src);
        a.load();                                    // 立即开始预加载
      }
      decodeVoice(i + 1, src);                       // 同时准备 WebAudio 主路径
    } catch (e) {}
  }
}
function stopVoice(){
  /* 注意：这里【不能】自增 audioGen —— 否则 seekTo(→stopVoice) 之后紧接着的
     play(→syncVoice→playVoiceFrom) 会被上一代回调误判为过期，导致某镜静音。
     代次只在 playVoiceFrom 里自增（一次「真正开始一段新配音」）。 */
  if (curSrc){ try { curSrc.onended = null; curSrc.stop(0); } catch (e) {} }
  if (curAudio){ try { curAudio.pause(); } catch (e) {} }
  curSrc = null; curAudio = null; curAudioMode = '';
  curAudioIdx = -1; audioAnchorTs = null;
}
/* 兜底路径：等 canplaythrough（readyState ≥ 3）再 play，失败重试一次 */
function elementPlay(i, offsetMs, attempt, gen){
  const a = voicePool[i];
  if (!a) return;
  if (gen !== undefined && gen !== audioGen) return;          // 已切走 → 丢弃
  let started = false;
  const off = Math.max(0, offsetMs) / 1000;
  const go = () => {
    if (started) return;                                      // 本代只播一次
    if (gen !== undefined && gen !== audioGen) return;
    started = true;
    try {
      if (off > 0.02) a.currentTime = off;
      a.playbackRate = 1;                                     // 语速原样，绝不改
      const pr = a.play();
      curAudio = a; curAudioMode = 'element'; curAudioIdx = i;
      if (pr && pr.then){                                     // 等真正开始播放再算基准
        pr.then(() => {
          if (gen !== undefined && gen !== audioGen) return;
          if (off > 0.02 && Math.abs(a.currentTime - off) > 0.25) a.currentTime = off;
        }).catch(err => {
          console.warn('[ModSideDetector] 第 ' + i + ' 段播放失败：' + (err && err.name));
          if (attempt < 1) setTimeout(() => elementPlay(i, offsetMs, attempt + 1, gen), 260);
          else if (curAudioIdx === i) { curAudio = null; curAudioMode = ''; curAudioIdx = -1; }
        });
      }
    } catch (e) {
      if (attempt < 1) setTimeout(() => elementPlay(i, offsetMs, attempt + 1, gen), 260);
    }
  };
  /* 就绪门限用 readyState ≥ 2（HAVE_CURRENT_DATA）而不是 ≥ 3：
     ≥3 要等整段缓冲完，在 file:// 下会多出 60~400ms 空档，听感就是「配音没响」。 */
  if (a.readyState >= 2) go();
  else {
    a.addEventListener('canplay', go, { once: true });
    a.addEventListener('canplaythrough', go, { once: true });
    let tries = 0;
    const poll = () => {
      if (gen !== undefined && gen !== audioGen) return;
      if (a.readyState >= 2) { go(); return; }
      if (++tries <= 5) setTimeout(poll, 120);
    };
    setTimeout(poll, 120);
  }
}
function playVoiceFrom(i, offsetMs){
  const myGen = ++audioGen;                          // 先停旧的：任意时刻最多一段
  if (curSrc){ try { curSrc.onended = null; curSrc.stop(0); } catch (e) {} curSrc = null; }
  if (curAudio){ try { curAudio.pause(); } catch (e) {} curAudio = null; }
  curAudioMode = ''; curAudioIdx = -1; audioAnchorTs = null;
  if (!voiceOn) return;
  const src = voiceSrc(i);
  if (!src) return;                                  // 该镜头无旁白

  const ctx = ensureAC();
  const buf = voiceBuf[i + 1];
  if (ctx && buf && !voiceFail[i + 1]){               // ---- 主路径：WebAudio 样本级精确
    try {
      const s = ctx.createBufferSource();
      s.buffer = buf;
      s.connect(ctx.destination);
      const off = Math.min(Math.max(0, offsetMs) / 1000, Math.max(0, buf.duration - 0.02));
      s.start(0, off);
      curSrc = s; curAudioMode = 'webaudio'; curAudioIdx = i;
      curStartWall = performance.now(); audioAnchorTs = clock;
      s.onended = () => { if (curSrc === s) curSrc = null; };
      return;
    } catch (e) {
      console.warn('[ModSideDetector] WebAudio 播放失败，回退 <audio>：' + (e && e.name));
    }
  }
  if (myGen !== audioGen) return;
  elementPlay(i + 1, offsetMs, 0, myGen);             // ---- 兜底：<audio>，就绪后播 + 重试
}
/* 时间轴 → 音频：进入镜头时按「已经过去多久」从中途接上 */
function syncVoice(clockMs){
  if (!voiceOn){ stopVoice(); return; }
  const i = indexAt(clockMs);
  /* WebAudio 主路径用 curSrc 判断是否在响；<audio> 兜底看 paused */
  const alive = (curAudioMode === 'webaudio') ? !!curSrc
              : (curAudioMode === 'element')  ? (!!curAudio && !curAudio.paused)
              : false;
  if (i !== curAudioIdx || !alive){
    const within = clockMs - shotStart(i);
    playVoiceFrom(i, within);
  }
  audioAnchorTs = clockMs;
}
/* 自检用：当前时刻该音频「应该」播到的秒数 */
function voiceExpectedOffset(clockMs){
  if (curAudioIdx < 0) return 0;
  return Math.max(0, clockMs - shotStart(curAudioIdx)) / 1000;
}
function voiceActualOffset(){
  if (curAudioMode === 'webaudio') return (performance.now() - curStartWall) / 1000;
  if (curAudioMode === 'element' && curAudio) return curAudio.currentTime;
  return 0;
}
function voicePlaying(){
  if (curAudioMode === 'webaudio') return !!curSrc;
  if (curAudioMode === 'element') return !!curAudio && !curAudio.paused;
  return false;
}

/* ---------- 渲染：给定全局毫秒，把画面精确定位到该时刻 ---------- */
let curIdx = -1, curEl = null, prevEl = null;

function newShotEl(i){
  const el = document.createElement('div');
  el.className = 'shot';
  el.innerHTML = '<div class="inner">' + SCRIPT[i].html + '</div>';
  stage.appendChild(el);          // 必须先挂载，打字机才能测宽
  return prepare(el);
}

function render(ms){
  ms = Math.max(0, Math.min(TOTAL - 1, ms));
  const i  = indexAt(ms);
  const tl = ms - shotStart(i);
  const dissolving = i > 0 && tl < DISSOLVE;      // 交叉溶解 0.4s：新旧镜头同时存在

  if (i !== curIdx){
    stage.innerHTML = '';
    prevEl = null;
    if (dissolving){
      prevEl = newShotEl(i - 1);
      applyItems(prevEl, SCRIPT[i - 1].d + 10000);   // 旧镜头停在终态
      prevEl.style.opacity = '1';
    }
    curEl = newShotEl(i);
    curIdx = i;
    subEl.textContent = SCRIPT[i].sub || '';
  }

  let curOp = 1;
  if (dissolving){
    const p = easeInOut(tl / DISSOLVE);
    curOp = p;
    prevEl.style.opacity = (1 - p).toFixed(4);
  } else if (prevEl){
    stage.removeChild(prevEl); prevEl = null;
  }
  curEl.style.opacity = curOp.toFixed(4);
  applyItems(curEl, tl);

  // 字幕：原地淡入
  subEl.style.opacity = SCRIPT[i].sub ? (curOp * easeOut(clamp01((tl - 100) / 340))).toFixed(4) : '0';

  // 背景网格滚动（规范允许的位移）
  const gp = (ms % 14000) / 14000 * 48;
  gridEl.style.backgroundPosition = '0 ' + gp.toFixed(2) + 'px, ' + gp.toFixed(2) + 'px 0';

  // 背景浮点
  for (let k = 0; k < dots.length; k++){
    const d = dots[k];
    const p = ((ms + d.phase) % d.dur) / d.dur;
    d.el.style.transform = 'translateY(' + (-(VH + 40) * p).toFixed(1) + 'px)';
    d.el.style.opacity = (Math.sin(Math.PI * p) * d.amp).toFixed(3);
  }
  // 星点闪烁
  for (let k = 0; k < stars.length; k++){
    const s = stars[k];
    const q = ((ms + s.phase) % s.period) / s.period;
    const v = Math.max(0, Math.sin(Math.PI * 2 * q));
    s.el.style.opacity = (v * v * v * s.amp).toFixed(3);
  }
  // 整屏极缓色相偏移（周期 17s）
  stage.style.filter = 'hue-rotate(' + (Math.sin(ms / 17000 * Math.PI * 2) * 9).toFixed(2) + 'deg)';
  // 光标闪烁（时间轴驱动）
  stage.style.setProperty('--blink', (Math.floor(ms / 500) % 2) === 0 ? '1' : '0');

  prog.style.width = (ms / TOTAL * 100).toFixed(3) + '%';
  hudInfo.textContent = '镜头 ' + (i + 1) + '/' + SCRIPT.length;
}

/* ---------- 播放循环 ---------- */
let clock = 0, lastTs = 0, playing = true, rafId = null, lastVoiceIdx = -1, manual = false;

function frame(now){
  rafId = requestAnimationFrame(frame);
  if (!playing){ lastTs = now; return; }
  if (!lastTs) lastTs = now;
  clock += now - lastTs;
  lastTs = now;
  if (clock >= TOTAL){ clock = 0; curIdx = -1; lastVoiceIdx = -1; stopVoice(); }
  const i = indexAt(clock);
  if (i !== lastVoiceIdx){ lastVoiceIdx = i; syncVoice(clock); }
  render(clock);
}
function start(){
  cancelAnimationFrame(rafId);
  clock = 0; lastTs = 0; curIdx = -1; lastVoiceIdx = -1;
  stopVoice(); playing = true;
  render(0);
  lastVoiceIdx = 0; syncVoice(0);
  rafId = requestAnimationFrame(frame);
}
function jumpTo(i){
  clock = shotStart(i); curIdx = -1; lastVoiceIdx = -1;
  stopVoice(); render(clock);
  lastVoiceIdx = i; syncVoice(clock);
}

/* ---------- 控件 ---------- */
const bTts = document.getElementById('bTts');
const bVoice = document.getElementById('bVoice');
document.getElementById('bReplay').onclick = start;
document.getElementById('bNext').onclick = () => jumpTo(Math.min(SCRIPT.length - 1, indexAt(clock) + 1));
document.getElementById('bPrev').onclick = () => jumpTo(Math.max(0, indexAt(clock) - 1));
bVoice.onclick = () => {
  VOICE_DIR = VOICE_DIR === 'male' ? 'female' : 'male';
  bVoice.textContent = VOICE_DIR === 'male' ? '男声' : '女声';
  preloadVoice();
  if (voiceOn){ lastVoiceIdx = indexAt(clock); syncVoice(clock); }
};
bTts.onclick = () => {
  voiceOn = !voiceOn;
  bTts.textContent = '配音:' + (voiceOn ? '开' : '关');
  bTts.classList.toggle('on', voiceOn);
  if (!voiceOn) stopVoice();
  else { lastVoiceIdx = indexAt(clock); syncVoice(clock); }
};

document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); playing = !playing; }
  if (e.code === 'ArrowRight') document.getElementById('bNext').click();
  if (e.code === 'ArrowLeft')  document.getElementById('bPrev').click();
  if (e.key === 'h' || e.key === 'H') hudEl.classList.toggle('hide');
  if (e.key === 'r' || e.key === 'R') start();
  if (e.key === 'v' || e.key === 'V') bTts.click();       // V 键开关配音
  if (e.key === 'g' || e.key === 'G') bVoice.click();     // G 键切换男/女声
});

/* ---------- 给自动录制脚本的确定性接口 ---------- */
window.__sync = {
  total: TOTAL,
  dissolve: DISSOLVE,
  shots: SCRIPT.map((s, i) => ({ n: i + 1, d: s.d, start: shotStart(i), sub: s.sub })),
  seekTo(ms){ manual = true; playing = false; clock = ms; lastTs = 0; stopVoice(); render(ms); },
  pause(){ playing = false; stopVoice(); },
  play(){ manual = true; playing = true; lastTs = 0; lastVoiceIdx = indexAt(clock); syncVoice(clock); },
  hideHud(){ hudEl.classList.add('hide'); },
  setVoice(v){ voiceOn = !!v; if (!voiceOn) stopVoice(); },
  setVoiceDir(d){ VOICE_DIR = d; preloadVoice(); },
  getMeta(){ return audioMeta; },
  /* ---- 音频自检接口 ---- */
  audioPlayingCount(){                       // 正在播放的音频数（必须 ≤1）
    let n = (curSrc ? 1 : 0);
    for (const k in voicePool){
      const a = voicePool[k];
      if (a !== curAudio && !a.paused && !a.ended && a.readyState > 2) n++;
    }
    return n;
  },
  audioDebug(){
    return { playing: window.__sync.audioPlayingCount(), idx: curAudioIdx,
             mode: curAudioMode, isPlaying: voicePlaying(),
             actual: +voiceActualOffset().toFixed(3),
             expected: +voiceExpectedOffset(clock).toFixed(3),
             paused: curAudio ? curAudio.paused : null,
             fail: JSON.parse(JSON.stringify(voiceFail)),
             decoded: Object.keys(voiceBuf).length };
  },
  audioOffsetErrorMs(){                      // |实际 − 应为| （毫秒）
    if (curAudioIdx < 0) return 0;
    return Math.abs(voiceActualOffset() - voiceExpectedOffset(clock)) * 1000;
  },
  render
};

if (/[?&]record/.test(location.search)) hudEl.classList.add('hide');

window.addEventListener('load', () => {
  preloadVoice();
  const m = /[?&]t=(\d+)/.exec(location.search);
  if (m){ window.__sync.seekTo(parseInt(m[1], 10)); return; }   // ?t=毫秒 直接定位
  setTimeout(() => { if (!manual) start(); }, 200);
});
</script>
